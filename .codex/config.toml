[features]
multi_agent = true

[agents]
enabled = true
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "low"

[agents.security_explorer]
description = "Analyse les preuves et limites de sécurité sans modifier le code."
config_file = "agents/security_explorer.toml"

[agents.security_implementer]
description = "Implémente une correction de sécurité délimitée et ses tests."
config_file = "agents/security_implementer.toml"

[agents.security_reviewer]
description = "Vérifie garanties, scénarios adverses et limites du changement."
config_file = "agents/security_reviewer.toml"
