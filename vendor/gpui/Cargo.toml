# Vendored from Zed 33c95853ed2b6956f339733c63a8220964ecbeb6.
# Workspace dependency inheritance is resolved to the same pinned sources;
# examples, tests and dev-dependencies are left out.

[package]
"name" = "gpui"
"version" = "0.2.2"
"edition" = "2024"
"publish" = false
"license" = "Apache-2.0"
"autotests" = false
"autoexamples" = false
"autobenches" = false
"description" = "Zed's GPU-accelerated UI framework"
"readme" = "README.md"

[lints.rust]
"unexpected_cfgs" = "allow"

[lib]
"path" = "src/gpui.rs"
"doctest" = false

[features]
"default" = ["font-kit", "wayland", "x11", "windows-manifest"]
"test-support" = ["leak-detection", "collections/test-support", "http_client/test-support", "wayland", "x11", "proptest"]
"bench-support" = ["profiler", "dep:criterion"]
"bench" = ["bench-support"]
"inspector" = ["gpui_macros/inspector"]
"leak-detection" = ["backtrace"]
"wayland" = []
"x11" = ["scap?/x11"]
"screen-capture" = ["scap"]
"windows-manifest" = ["dep:embed-resource"]
"profiler" = ["dep:hdrhistogram"]
"stacker" = ["dep:stacksafe"]

[dependencies]
"accesskit" = { "version" = "0.24.0", "features" = ["enumn"] }
"anyhow" = { "version" = "1.0.86" }
"async-task" = { "version" = "4.7" }
"backtrace" = { "version" = "0.3", "optional" = true }
"bitflags" = { "version" = "2.6.0" }
"chrono" = { "version" = "0.4", "features" = ["serde"] }
"collections" = { "version" = "0.1.0", "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"criterion" = { "version" = "0.5", "features" = ["html_reports"], "optional" = true }
"ctor" = { "version" = "1.0.12" }
"derive_more" = { "version" = "2.1.1", "features" = ["add", "add_assign", "deref", "deref_mut", "display", "from", "from_str", "mul", "mul_assign", "not"] }
"etagere" = { "version" = "0.2" }
"futures" = { "version" = "0.3.34" }
"futures-concurrency" = { "version" = "7.7.1" }
"gpui_macros" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"gpui_shared_string" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"gpui_util" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"hdrhistogram" = { "version" = "7", "default-features" = false, "optional" = true }
"heapless" = { "version" = "0.9.2" }
"http_client" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"image" = { "version" = "0.25.1", "default-features" = false, "features" = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
"inventory" = { "version" = "0.3.19" }
"itertools" = { "version" = "0.14.0" }
"log" = { "version" = "0.4.16", "features" = ["kv_unstable_serde", "serde"] }
"lyon" = { "version" = "1.0" }
"num_cpus" = { "version" = "1.13" }
"parking" = { "version" = "2.0.0" }
"parking_lot" = { "version" = "0.12.1" }
"pin-project" = { "version" = "1.1.10" }
"pollster" = { "version" = "0.4.0" }
"postage" = { "version" = "0.5", "features" = ["futures-traits"] }
"profiling" = { "version" = "1" }
"proptest" = { "git" = "https://github.com/proptest-rs/proptest", "rev" = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", "features" = ["attr-macro"], "optional" = true }
"rand" = { "version" = "0.9" }
"raw-window-handle" = { "version" = "0.6" }
"refineable" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"regex" = { "version" = "1.5" }
"resvg" = { "version" = "0.46.0", "default-features" = false, "features" = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
"scheduler" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"schemars" = { "version" = "1.0", "features" = ["indexmap2"] }
"seahash" = { "version" = "4.1" }
"serde" = { "version" = "1.0.221", "features" = ["derive", "rc"] }
"serde_json" = { "version" = "1.0.144", "features" = ["preserve_order", "raw_value"] }
"slotmap" = { "version" = "1.0.6" }
"smallvec" = { "version" = "1.6", "features" = ["union", "const_new"] }
"spin" = { "version" = "0.10.0" }
"stacksafe" = { "version" = "1.0", "optional" = true }
"strum" = { "version" = "0.28", "features" = ["derive"] }
"sum_tree" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"taffy" = { "version" = "=0.13.0" }
"thiserror" = { "version" = "2.0.12" }
"ttf-parser" = { "version" = "0.25" }
"url" = { "version" = "2.2" }
"usvg" = { "version" = "0.46.0", "default-features" = false }
"util_macros" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"uuid" = { "version" = "1.1.2", "features" = ["v4", "v5", "v7", "serde"] }
"waker-fn" = { "version" = "1.2.0" }
"web-time" = { "version" = "1.1.0" }

[build-dependencies]
"embed-resource" = { "version" = "3.0", "optional" = true }

[target."cfg(all(target_arch = \"wasm32\", target_os = \"unknown\"))".dependencies]
"async-channel" = { "version" = "2.5.0", "default-features" = false }

[target."cfg(not(all(target_arch = \"wasm32\", target_os = \"unknown\")))".dependencies]
"async-channel" = { "version" = "2.5.0" }

[target."cfg(target_family = \"wasm\")".dependencies]
"getrandom" = { "version" = "0.3.4", "features" = ["wasm_js"] }
"uuid" = { "version" = "1.1.2", "features" = ["v4", "v5", "v7", "serde", "js"] }

[target."cfg(target_os = \"macos\")".dependencies]
"core-video" = { "version" = "0.5.2", "features" = ["metal"] }
"font-kit" = { "git" = "https://github.com/zed-industries/font-kit", "rev" = "94b0f28166665e8fd2f53ff6d268a14955c82269", "package" = "zed-font-kit", "version" = "0.14.1-zed", "optional" = true }
"log" = { "version" = "0.4.16", "features" = ["kv_unstable_serde", "serde"] }
"objc2" = { "version" = "0.6", "optional" = true }
"objc2-metal" = { "version" = "0.3", "optional" = true }

[target."cfg(target_os = \"macos\")".build-dependencies]
"bindgen" = { "version" = "0.72" }

[target."cfg(any(target_os = \"linux\", target_os = \"freebsd\", target_os = \"windows\"))".dependencies]
"scap" = { "git" = "https://github.com/zed-industries/scap", "rev" = "4afea48c3b002197176fb19cd0f9b180dd36eaac", "default-features" = false, "package" = "zed-scap", "version" = "0.0.8-zed", "optional" = true }

[target."cfg(target_os = \"windows\")".dependencies]
"windows" = { "version" = "0.62", "features" = ["Data_Xml_Dom", "Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_Notifications", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media"] }
