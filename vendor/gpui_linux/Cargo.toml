# Vendored from Zed 33c95853ed2b6956f339733c63a8220964ecbeb6.
# Workspace dependency inheritance is resolved to the same pinned sources;
# examples, tests and dev-dependencies are left out.

[package]
"name" = "gpui_linux"
"version" = "0.1.0"
"edition" = "2024"
"publish" = false
"license" = "Apache-2.0"
"autotests" = false
"autoexamples" = false
"autobenches" = false

[lints.rust]
"unexpected_cfgs" = "allow"

[lib]
"path" = "src/gpui_linux.rs"

[features]
"default" = ["wayland", "x11"]
"test-support" = ["gpui/test-support"]
"wayland" = ["bitflags", "gpui_wgpu", "ashpd/wayland", "calloop-wayland-source", "wayland-backend", "wayland-client", "wayland-cursor", "wayland-protocols", "wayland-protocols-plasma", "wayland-protocols-wlr", "filedescriptor", "xkbcommon/wayland", "open", "gpui/wayland"]
"x11" = ["gpui_wgpu", "ashpd", "as-raw-xcb-connection", "x11rb", "xkbcommon/x11", "xim", "x11-clipboard", "filedescriptor", "open", "scap?/x11"]
"screen-capture" = ["gpui/screen-capture", "scap"]

[target."cfg(any(target_os = \"linux\", target_os = \"freebsd\"))".dependencies]
"accesskit" = { "version" = "0.24.0", "features" = ["enumn"] }
"accesskit_unix" = { "version" = "0.22" }
"anyhow" = { "version" = "1.0.86" }
"as-raw-xcb-connection" = { "version" = "1", "optional" = true }
"ashpd" = { "version" = "0.13", "default-features" = false, "features" = ["async-io", "inhibit", "notification", "open_uri", "file_chooser", "settings", "trash"], "optional" = true }
"bitflags" = { "version" = "2.6.0", "optional" = true }
"bytemuck" = { "version" = "1" }
"calloop" = { "version" = "0.14.3" }
"calloop-wayland-source" = { "version" = "0.4.1", "optional" = true }
"collections" = { "version" = "0.1.0", "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"filedescriptor" = { "version" = "0.8.2", "optional" = true }
"futures" = { "version" = "0.3.34" }
"gpui" = { "default-features" = false, "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"gpui_util" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"gpui_wgpu" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6", "features" = ["font-kit"], "optional" = true }
"http_client" = { "git" = "https://github.com/zed-industries/zed", "rev" = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
"libc" = { "version" = "0.2" }
"log" = { "version" = "0.4.16", "features" = ["kv_unstable_serde", "serde"] }
"notify-rust" = { "version" = "4" }
"oo7" = { "version" = "0.6", "default-features" = false, "features" = ["async-std", "native_crypto"] }
"open" = { "version" = "5.2.0", "optional" = true }
"parking_lot" = { "version" = "0.12.1" }
"raw-window-handle" = { "version" = "0.6" }
"scap" = { "git" = "https://github.com/zed-industries/scap", "rev" = "4afea48c3b002197176fb19cd0f9b180dd36eaac", "default-features" = false, "package" = "zed-scap", "version" = "0.0.8-zed", "optional" = true }
"smallvec" = { "version" = "1.6", "features" = ["union", "const_new"] }
"smol" = { "version" = "2.0" }
"strum" = { "version" = "0.28", "features" = ["derive"] }
"url" = { "version" = "2.2" }
"uuid" = { "version" = "1.1.2", "features" = ["v4", "v5", "v7", "serde"] }
"wayland-backend" = { "version" = "0.3.15", "features" = ["client_system", "dlopen", "log"], "optional" = true }
"wayland-client" = { "version" = "0.31.11", "optional" = true }
"wayland-cursor" = { "version" = "0.31.11", "optional" = true }
"wayland-protocols" = { "version" = "0.32.9", "features" = ["client", "staging", "unstable"], "optional" = true }
"wayland-protocols-plasma" = { "version" = "0.3.9", "features" = ["client"], "optional" = true }
"wayland-protocols-wlr" = { "version" = "0.3.9", "features" = ["client"], "optional" = true }
"x11-clipboard" = { "version" = "0.9.3", "optional" = true }
"x11rb" = { "version" = "0.13.1", "features" = ["allow-unsafe-code", "xkb", "randr", "xinput", "cursor", "resource_manager", "sync", "dri3"], "optional" = true }
"xim" = { "git" = "https://github.com/zed-industries/xim-rs.git", "rev" = "16f35a2c881b815a2b6cdfd6687988e84f8447d8", "features" = ["x11rb-xcb", "x11rb-client"], "package" = "zed-xim", "version" = "0.4.0-zed", "optional" = true }
"xkbcommon" = { "version" = "0.8.0", "default-features" = false, "optional" = true }
