[package]
name = "oxyde"
version = "2.0.2"
description = "Modern and fast file manager"
authors = ["Carlton2001"]
edition = "2021"
license = "GPL-3.0-only"
default-run = "oxyde"

# GPUI refreshes the scene while the native window moves. Keep development
# builds responsive while preserving debug information and assertions.
[profile.dev]
opt-level = 1
# Avoid unreliable hard links in the incremental cache on Windows workspaces.
# Cargo still reuses unchanged crates and keeps compiler diagnostics enabled.
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Same pinned GPUI Windows backend, with full-size atlas initialization fixed.
# Provenance and the small native patch: vendor/gpui_windows/README.oxyde.md.
[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }
# Same pin, with popups that can move: vendor/gpui_linux/README.oxyde.md.
gpui = { path = "vendor/gpui" }
gpui_linux = { path = "vendor/gpui_linux" }

[lints.clippy]
# Readonly is only cleared on Windows and in tests, where it removes
# FILE_ATTRIBUTE_READONLY rather than granting Unix world-write access.
permissions_set_readonly_false = "allow"

[lib]
name = "oxyde_lib"

[build-dependencies]
embed-resource = "3.0.11"

[dependencies]
# Keep both GPUI crates on the same Zed stable release; the crates.io release
# has the same version number but an older API.
gpui = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6", features = ["wayland", "x11"] }
tokio = { version = "1", features = ["fs", "sync", "time", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
glob = "0.3.1"
walkdir = "2.5.0"
trash = "5.2.9"
# Keep current image decoders and rayon, without the unused AVIF encoder.
# `avif` enables ravif/rav1e, not AVIF decoding (`avif-native` is separate).
image = { version = "0.25.1", default-features = false, features = [
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png",
    "pnm", "qoi", "rayon", "tga", "tiff", "webp",
] }
futures = "0.3"
fs_extra = "1.3.0"
zip = { version = "9.0.4", features = ["chrono"] }
sevenz-rust2 = "0.24.0"
tar = "0.4.40"
flate2 = "1.0.30"
usvg = { version = "0.46.0", default-features = false }
xz2 = "0.1.7"
zstd = { version = "0.14.0", features = ["zstdmt"] }
bzip2 = "0.6.1"
lazy_static = "1.5.0"
log = "0.4"
env_logger = "0.11.11"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
chrono = { version = "0.4.43", features = ["serde"] }
percent-encoding = "2.3.1"
regex = "1.10"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "nfa-thompson", "unicode"] }
unicode-normalization = "0.1.23"
blake3 = "1.8.3"
rayon = "1.11.0"
dashmap = "6.1.0"
once_cell = "1.19.0"
jwalk = "0.9.0"
dirs = "7.0.0"
unicode-segmentation = "1.11.0"
rust-embed = "8.5.0"
raw-window-handle = "0.6.2"
fluent-bundle = "0.16"
unic-langid = "0.9"
tempfile = "3.10"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "yaml-load"] }
pulldown-cmark = { version = "0.13", default-features = false }
lofty = "0.25.4"
minisign-verify = "0.2"
base64 = "0.22"

# Already locked through GPUI's Linux backend: UDisks2 over D-Bus, free space by statvfs,
# mount notifications by poll, GIO loaded at run time for GVfs network locations.
[target.'cfg(not(target_os = "windows"))'.dependencies]
libloading = "0.8"
rustix = { version = "1.1", default-features = false, features = ["event", "fs", "pipe", "process", "std"] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Required by the official COM implementation macro; already used by windows.
windows-core = "0.62.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Globalization",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinHttp",
    "Win32_System_Wmi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Graphics_Imaging",
]
