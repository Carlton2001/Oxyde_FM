name: Linux

on:
  push:
    branches: [main, linux-foundation]
    paths: &paths
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - about.toml
      - 'locales/**'
      - 'assets/**'
      - 'packaging/linux/**'
      - scripts/build-linux-packages.sh
      - scripts/check-linux.sh
      - scripts/linux-third-party-notices.py
      - scripts/rpm-license.py
      - scripts/third-party-notices.hbs
      - .github/workflows/linux.yml
      - .github/workflows/_linux-distribution.yml
  pull_request:
    branches: [main, linux-foundation]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.99.1

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan1 bubblewrap libseccomp2 \
            libpoppler-glib8t64 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Allow user namespaces, as the package's AppArmor profile does
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-dev-v1
          cache-bin: false
      - name: Compile all targets without warnings
        run: bash scripts/check-linux.sh
        env:
          # The tests expect the default folder.
          CARGO_TARGET_DIR: target
          RUSTFLAGS: -D warnings
      - name: Build the workers the tests run
        run: cargo build --locked --bins
      - name: Run the tests
        run: cargo test --locked --no-fail-fast -- --skip preview_jobs
      # Their 2 s deadlines fail intermittently while the whole suite loads the machine.
      - name: Run the tests with deadlines alone
        run: cargo test --locked --bin oxyde preview_jobs

  # The DEB, the RPM and the per-user archive, as a release builds them.
  distribution:
    needs: tests
    uses: ./.github/workflows/_linux-distribution.yml
