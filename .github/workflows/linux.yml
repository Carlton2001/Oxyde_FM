name: Linux

on:
  push:
    branches: [main, linux-foundation]
    paths: &paths
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - about.toml
      - 'locales/**'
      - 'assets/**'
      - 'packaging/linux/**'
      - scripts/build-linux-packages.sh
      - scripts/check-linux.sh
      - scripts/linux-third-party-notices.py
      - scripts/rpm-license.py
      - scripts/third-party-notices.hbs
      - .github/workflows/linux.yml
  pull_request:
    branches: [main, linux-foundation]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.99.1
  CARGO_ABOUT_VERSION: 0.9.2
  # From the official release's .tar.gz.sha256; pin locally, never trust a downloaded checksum alone.
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan1 bubblewrap libseccomp2 \
            libpoppler-glib8t64 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Allow user namespaces, as the package's AppArmor profile does
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-dev-v1
          cache-bin: false
      - name: Compile all targets without warnings
        run: bash scripts/check-linux.sh
        env:
          # The tests expect the default folder.
          CARGO_TARGET_DIR: target
          RUSTFLAGS: -D warnings
      - name: Build the workers the tests run
        run: cargo build --locked --bins
      - name: Run the tests
        run: cargo test --locked --no-fail-fast -- --skip preview_jobs
      # Their 2 s deadlines fail intermittently while the whole suite loads the machine.
      - name: Run the tests with deadlines alone
        run: cargo test --locked --bin oxyde preview_jobs

  rpm:
    needs: tests
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git-core tar gzip zstd rustup rpm-build python3 binutils gcc gcc-c++ make \
            pkgconf-pkg-config fontconfig-devel freetype-devel libxkbcommon-devel \
            libxkbcommon-x11-devel libxcb-devel wayland-devel desktop-file-utils appstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup-init -y --no-modify-path --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-about
        run: &install-cargo-about |
          package="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/cargo-about.tar.gz \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$package.tar.gz"
          echo "$CARGO_ABOUT_SHA256  /tmp/cargo-about.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-about.tar.gz -C "$HOME/.cargo/bin" --strip-components=1 "$package/cargo-about"
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-rpm-v1
          cache-bin: false
      - name: Build the RPM
        run: bash scripts/build-linux-packages.sh --rpm
      - name: Install the RPM with its dependencies
        run: dnf install -y target/linux-packages/output/*.rpm && test -x /usr/bin/oxyde-archive-io-worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Oxyde-rpm-x64
          path: target/linux-packages/output/*.rpm*
          if-no-files-found: error
          compression-level: 0

  deb:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libwayland-dev dpkg-dev lintian python3 \
            desktop-file-utils appstream
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - name: Install cargo-about
        run: *install-cargo-about
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-deb-v1
          cache-bin: false
      - name: Build the DEB
        run: bash scripts/build-linux-packages.sh --deb
      - name: Install the DEB with its dependencies
        run: sudo apt-get install -y ./target/linux-packages/output/*.deb && test -x /usr/bin/oxyde-archive-io-worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Oxyde-deb-x64
          path: target/linux-packages/output/*.deb*
          if-no-files-found: error
          compression-level: 0
