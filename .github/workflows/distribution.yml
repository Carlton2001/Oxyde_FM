name: Windows portable distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - name: Install license generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Check application
        run: cargo check --locked
      - name: Test portable storage
        run: cargo test --locked --lib app_paths::tests -- --test-threads=1
      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/build-distribution.ps1 -PortableOnly
      - name: Upload portable distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Oxyde_FM-portable-x64
          path: |
            target/distribution/output/*-portable.zip
            target/distribution/output/*-portable.zip.sha256
          if-no-files-found: error
          compression-level: 0
