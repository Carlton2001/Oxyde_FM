name: Windows portable distribution

on:
  # Release tags may restore caches saved on main, never those of a previous tag.
  # Build on main only when the cached dependencies or toolchain can change.
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - '.cargo/**'
      - '.github/actions/setup-distribution/**'
      - .github/workflows/distribution.yml
      - .github/workflows/_distribution.yml
  # Run by hand for test files or to check packaging scripts before a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-commit:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_release-commit.yml
  portable:
    needs: release-commit
    # A version bump keeps the dependency cache key; its tag builds the release files.
    if: ${{ !failure() && !cancelled() && needs.release-commit.outputs.release != 'true' }}
    uses: ./.github/workflows/_distribution.yml
