name: Release

# Started by pushing a v<x.y.z> tag created with scripts/bump-version.ps1.
# This run tests, audits and builds the tagged commit once, then signs those same
# files into a draft release. Main skips these checks for the version bump commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against Cargo version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --offline --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'oxyde').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
  tests:
    uses: ./.github/workflows/_tests.yml
  audit:
    uses: ./.github/workflows/_audit.yml
  distribution:
    uses: ./.github/workflows/_distribution.yml
  linux:
    uses: ./.github/workflows/_linux-distribution.yml
  release:
    needs: [version, tests, audit, distribution, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the updater signing secrets; protection rules can be added on GitHub.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download files built by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Oxyde_FM-*-x64
          merge-multiple: true
          path: target/distribution/output
      - name: Sign setup for the updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret.' }
          $setup = "target/distribution/output/Oxyde_FM_${{ needs.version.outputs.version }}_x64-setup.exe"
          npx --yes @tauri-apps/cli@2.10.1 signer sign $setup
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature failed.' }
      # The key Oxyde compiles in decides whether Windows copies accept the update: a
      # secret holding another key would sign a Setup that every updater refuses.
      - name: Check the Setup signature against Oxyde's updater key
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          bash scripts/check-updater-signature.sh "target/distribution/output/Oxyde_FM_${RELEASE_VERSION}_x64-setup.exe"
      # After the Setup's .sig: SHA256SUMS covers every file of the release.
      - name: Sign Linux packages and checksums with GPG
        env:
          OXYDE_GPG_PRIVATE_KEY: ${{ secrets.OXYDE_GPG_PRIVATE_KEY }}
          OXYDE_GPG_PASSPHRASE: ${{ secrets.OXYDE_GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          bash scripts/sign-linux-release.sh "$RELEASE_VERSION" target/distribution/output
      - name: Write the update manifest
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $output = 'target/distribution/output'
          $rpm = @(Get-ChildItem -LiteralPath $output -Filter "oxyde-$version-1.*.x86_64.rpm")
          if ($rpm.Count -ne 1) { throw 'Expected exactly one RPM.' }
          ./scripts/write-update-manifest.ps1 -Version $version -Setup "$output/Oxyde_FM_${version}_x64-setup.exe" `
            -LinuxArchive "$output/oxyde-$version-x86_64-linux.tar.gz" -LinuxDeb "$output/oxyde_$version-1_amd64.deb" `
            -LinuxRpm $rpm[0].FullName -Destination "$output/latest.json"
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $output = 'target/distribution/output'
          $setup = "$output/Oxyde_FM_${version}_x64-setup.exe"
          $rpm = (Get-ChildItem -LiteralPath $output -Filter "oxyde-$version-1.*.x86_64.rpm").FullName
          gh release create "v$version" --draft --verify-tag --title "Oxyde v$version" `
            --notes 'Consultez le CHANGELOG pour la liste des changements.' `
            $setup "$setup.sig" `
            "$output/Oxyde_FM-$version-x64-portable.zip" `
            "$output/latest.json" `
            "$output/oxyde-$version-x86_64-linux.tar.gz" "$output/oxyde-$version-x86_64-linux.tar.gz.asc" `
            "$output/oxyde_$version-1_amd64.deb" "$output/oxyde_$version-1_amd64.deb.asc" `
            $rpm "$rpm.asc" `
            "$output/install.sh" `
            "$output/SHA256SUMS" "$output/SHA256SUMS.asc"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
