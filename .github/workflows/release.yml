name: Release

# Started by pushing a v<x.y.z> tag created with scripts/bump-version.ps1.
# This run tests, audits and builds the tagged commit once, then signs those same
# files into a draft release. Main skips these checks for the version bump commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against Cargo version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --offline --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'oxyde').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
  tests:
    uses: ./.github/workflows/_tests.yml
  audit:
    uses: ./.github/workflows/_audit.yml
  distribution:
    uses: ./.github/workflows/_distribution.yml
  release:
    needs: [version, tests, audit, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the updater signing secrets; protection rules can be added on GitHub.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download files built by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Oxyde_FM-*-x64
          merge-multiple: true
          path: target/distribution/output
      - name: Sign setup for the updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret.' }
          $setup = "target/distribution/output/Oxyde_FM_${{ needs.version.outputs.version }}_x64-setup.exe"
          npx --yes @tauri-apps/cli@2.10.1 signer sign $setup
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature failed.' }
          ./scripts/write-update-manifest.ps1 -Version ${{ needs.version.outputs.version }} -Setup $setup -Destination target/distribution/output/latest.json
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $output = 'target/distribution/output'
          $setup = "$output/Oxyde_FM_${version}_x64-setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$setup.sha256", "$hash  $([IO.Path]::GetFileName($setup))`n")
          gh release create "v$version" --draft --verify-tag --title "Oxyde v$version" `
            --notes 'Consultez le CHANGELOG pour la liste des changements.' `
            $setup "$setup.sig" "$setup.sha256" `
            "$output/Oxyde_FM-$version-x64-portable.zip" "$output/Oxyde_FM-$version-x64-portable.zip.sha256" `
            "$output/latest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
