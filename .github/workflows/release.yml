name: Release

# Started by pushing a v<x.y.z> tag created with scripts/bump-version.ps1.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against Cargo version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'oxyde').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - name: Install license generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Test portable storage
        run: cargo test --locked --lib app_paths::tests -- --test-threads=1
      - name: Build setup and portable ZIP
        shell: pwsh
        run: ./scripts/build-distribution.ps1
      - name: Sign setup for the updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret.' }
          $setup = "target/distribution/output/Oxyde_FM_${{ steps.version.outputs.version }}_x64-setup.exe"
          npx --yes @tauri-apps/cli@2.10.1 signer sign $setup
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature failed.' }
          ./scripts/write-update-manifest.ps1 -Version ${{ steps.version.outputs.version }} -Setup $setup -Destination target/distribution/output/latest.json
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $output = 'target/distribution/output'
          $setup = "$output/Oxyde_FM_${version}_x64-setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$setup.sha256", "$hash  $([IO.Path]::GetFileName($setup))`n")
          gh release create "v$version" --draft --verify-tag --title "Oxyde v$version" `
            --notes 'Consultez le CHANGELOG pour la liste des changements.' `
            $setup "$setup.sig" "$setup.sha256" `
            "$output/Oxyde_FM-$version-x64-portable.zip" "$output/Oxyde_FM-$version-x64-portable.zip.sha256" `
            "$output/latest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
