name: Release

# Started by pushing a v<x.y.z> tag created with scripts/bump-version.ps1.
# The release commit also changes Cargo.toml and Cargo.lock on main, which starts the
# native tests, the dependency audit and the distribution build for that exact commit.
# This workflow waits for them, reuses their files, then signs and drafts the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    # Waiting and signing need no Windows runner; the executables come from distribution.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against Cargo version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --offline --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'oxyde').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Wait for tests, audit and distribution of this commit
        id: checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-release-checks.ps1 -Commit $env:GITHUB_SHA
      - name: Download distribution built for this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Oxyde_FM-*-x64
          merge-multiple: true
          path: target/distribution/output
          run-id: ${{ steps.checks.outputs.distribution-run-id }}
          github-token: ${{ github.token }}
      - name: Verify commit, version and checksums
        shell: pwsh
        run: ./scripts/release-build-info.ps1 -Verify -Directory target/distribution/output -Commit $env:GITHUB_SHA -Version ${{ steps.version.outputs.version }}
      - name: Sign setup for the updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret.' }
          $setup = "target/distribution/output/Oxyde_FM_${{ steps.version.outputs.version }}_x64-setup.exe"
          npx --yes @tauri-apps/cli@2.10.1 signer sign $setup
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature failed.' }
          ./scripts/write-update-manifest.ps1 -Version ${{ steps.version.outputs.version }} -Setup $setup -Destination target/distribution/output/latest.json
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $output = 'target/distribution/output'
          $setup = "$output/Oxyde_FM_${version}_x64-setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$setup.sha256", "$hash  $([IO.Path]::GetFileName($setup))`n")
          gh release create "v$version" --draft --verify-tag --title "Oxyde v$version" `
            --notes 'Consultez le CHANGELOG pour la liste des changements.' `
            $setup "$setup.sig" "$setup.sha256" `
            "$output/Oxyde_FM-$version-x64-portable.zip" "$output/Oxyde_FM-$version-x64-portable.zip.sha256" `
            "$output/latest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
