name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action will replace this with the version from tauri.conf.json
          releaseName: "Oxyde FM v__VERSION__"
          releaseBody: "Consultez le README pour la liste des changements."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Create Portable Version
        shell: pwsh
        run: |
          $Config = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $Version = $Config.version
          $OutputFolder = "Oxyde_FM_v$($Version)_Portable"
          New-Item -ItemType Directory -Path $OutputFolder
          New-Item -ItemType Directory -Path "$OutputFolder/data"
          
          # Copy binary and metadata
          # In Tauri v2, the binary in target/release follows the Cargo.toml name (oxyde-fm.exe)
          Copy-Item "src-tauri/target/release/oxyde-fm.exe" -Destination "$OutputFolder/Oxyde_FM.exe"
          Copy-Item "README.md" -Destination "$OutputFolder/"
          
          # Create ZIP
          Compress-Archive -Path "$OutputFolder/*" -DestinationPath "Oxyde_FM_v$($Version)_Portable.zip"

      - name: Upload Portable ZIP to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Oxyde_FM_v*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
