name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Extract Version
        shell: pwsh
        run: |
          $Config = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $Version = $Config.version
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$Version"
          echo "Version found: $Version"

      - name: install frontend dependencies
        run: npm ci

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.APP_VERSION }}
          releaseName: "Oxyde FM v${{ env.APP_VERSION }}"
          releaseBody: "Consultez le CHANGELOG pour la liste des changements."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Create Portable Version
        shell: pwsh
        run: |
          $Version = "${{ env.APP_VERSION }}"
          if (-not $Version) {
              $Config = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
              $Version = $Config.version
          }
          $OutputFolder = "Oxyde_FM_v$($Version)_Portable"
          New-Item -ItemType Directory -Path $OutputFolder
          
          # Create full data structure for portable mode
          $DataFolder = "$OutputFolder/data"
          New-Item -ItemType Directory -Path "$DataFolder/config"
          New-Item -ItemType Directory -Path "$DataFolder/cache"
          New-Item -ItemType Directory -Path "$DataFolder/webview"
          
          # Add .gitkeep to ensure empty folders are zipped
          New-Item -Path "$DataFolder/config/.gitkeep" -ItemType File -Force
          New-Item -Path "$DataFolder/cache/.gitkeep" -ItemType File -Force
          New-Item -Path "$DataFolder/webview/.gitkeep" -ItemType File -Force
          New-Item -Path "$DataFolder/portable.txt" -ItemType File -Value "Oxyde Portable Mode Active" -Force
          
          # Copy binary and metadata
          # In Tauri v2, the binary in target/release follows the Cargo.toml name (oxyde-fm.exe)
          Copy-Item "src-tauri/target/release/oxyde-fm.exe" -Destination "$OutputFolder/Oxyde_FM.exe"
          Copy-Item "README.md" -Destination "$OutputFolder/"
          Copy-Item "CHANGELOG.md" -Destination "$OutputFolder/" -ErrorAction SilentlyContinue
          Copy-Item ".idea/changelog.md" -Destination "$OutputFolder/" -ErrorAction SilentlyContinue
          
          # Create ZIP
          Compress-Archive -Path "$OutputFolder" -DestinationPath "Oxyde_FM_v$($Version)_Portable.zip"

      - name: Prepare Updater JSON for GitHub
        shell: pwsh
        run: |
          # Copy updater.json to latest.json to match tauri.conf.json endpoint
          if (Test-Path "src-tauri/target/release/updater.json") {
            Copy-Item "src-tauri/target/release/updater.json" -Destination "latest.json"
          } elseif (Test-Path "src-tauri/updater.json") {
             Copy-Item "src-tauri/updater.json" -Destination "latest.json"
          }

      - name: Upload Additional Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Oxyde_FM_v*_Portable.zip
            latest.json
          tag_name: v${{ env.APP_VERSION }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
