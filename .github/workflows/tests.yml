name: Windows native tests

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - 'locales/**'
      - 'assets/**'
      - '.cargo/**'
      - scripts/test-windows.ps1
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - 'locales/**'
      - 'assets/**'
      - '.cargo/**'
      - scripts/test-windows.ps1
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - name: Restore native Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-native-dev-v1
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Compile all targets, build workers and run native tests
        shell: pwsh
        run: ./scripts/test-windows.ps1
