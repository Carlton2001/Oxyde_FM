name: Windows native tests

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - 'locales/**'
      - 'assets/**'
      - '.cargo/**'
      - scripts/test-windows.ps1
      - scripts/detect-release-commit.ps1
      - .github/workflows/tests.yml
      - .github/workflows/_tests.yml
      - .github/workflows/_release-commit.yml
  pull_request:
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - 'locales/**'
      - 'assets/**'
      - '.cargo/**'
      - scripts/test-windows.ps1
      - .github/workflows/tests.yml
      - .github/workflows/_tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-commit:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_release-commit.yml
  native:
    needs: release-commit
    # The release tag tests a version bump commit; main does not repeat it.
    if: ${{ !failure() && !cancelled() && needs.release-commit.outputs.release != 'true' }}
    uses: ./.github/workflows/_tests.yml
