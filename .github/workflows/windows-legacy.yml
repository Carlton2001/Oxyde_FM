name: Windows Server 2022 native paths

# Manual check on the oldest available Windows kernel (build 20348, the
# Windows 10 21H2 generation) for native path behavior differences.
on:
  push:
    branches: ["windows-legacy/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-paths:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - name: Run native path tests
        run: cargo test --lib platform::windows_no_reparse
