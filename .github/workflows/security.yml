name: Windows dependency security

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, scripts/audit-security.ps1, scripts/install-cargo-audit.ps1, scripts/tests/install-cargo-audit.tests.ps1, scripts/detect-release-commit.ps1, .github/workflows/security.yml, .github/workflows/_audit.yml, .github/workflows/_release-commit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, scripts/audit-security.ps1, scripts/install-cargo-audit.ps1, scripts/tests/install-cargo-audit.tests.ps1, .github/workflows/security.yml, .github/workflows/_audit.yml]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-commit:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_release-commit.yml
  rustsec:
    needs: release-commit
    # The release tag audits a version bump commit; main does not repeat it.
    if: ${{ !failure() && !cancelled() && needs.release-commit.outputs.release != 'true' }}
    uses: ./.github/workflows/_audit.yml
