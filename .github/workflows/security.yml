name: Windows dependency security

on:
  push:
    branches: [master]
    paths: [Cargo.toml, Cargo.lock, scripts/audit-security.ps1, .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, scripts/audit-security.ps1, .github/workflows/security.yml]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: rustup update stable --no-self-update
      - name: Audit locked Windows dependencies
        shell: pwsh
        run: ./scripts/audit-security.ps1
