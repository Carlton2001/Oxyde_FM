name: Windows dependency security (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit locked Windows dependencies
        shell: pwsh
        run: ./scripts/audit-security.ps1
      - name: Preserve security audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-windows
          path: target/security-audit-windows.json
          if-no-files-found: warn
